name: Restack MHTML review branch

on:
  push:
    branches: [verify/mhtml-cubic-review]

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild MHTML branch on reviewed HTML head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marcell Manfrin Barbacena"
          git config user.email "barbacena@gmail.com"
          git fetch origin feature/html-support-pr feature/mhtml-support-pr verify/mhtml-rebuild
          git checkout -B verify/mhtml-rebuild origin/feature/html-support-pr
          if ! git cherry-pick --no-commit af6e811768ab8be1bfa09b3f47f832891090aa62; then
            for path in Cargo.toml Cargo.lock src/formats/html.rs; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
            if git ls-files -u | grep -q .; then
              echo "Unexpected conflicts remain:"
              git status --short
              exit 1
            fi
          fi
          git add -A
          git commit -m "feat: restack MHTML support on reviewed HTML head"
          git push --force-with-lease origin HEAD:verify/mhtml-rebuild

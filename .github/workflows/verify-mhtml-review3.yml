name: Verify MHTML review round 3
on:
  push:
    branches: [verify/mhtml-review3-272d6a1]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 272d6a154a94a2c6915b46c424db6fce08f5a95a
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply minimal MHTML parse reuse refactor
        run: |
          sed -i '/let html = super::html::decode_html_with_charset/a\    let parsed_html = Html::parse_document(&html);' src/formats/mhtml.rs
          sed -i 's/html_resource_base(&html, root_location)/html_resource_base(&parsed_html, root_location)/' src/formats/mhtml.rs
          sed -i '0,/        &html,/s//        &parsed_html,/' src/formats/mhtml.rs
          sed -i 's/fn html_resource_base(html: &str,/fn html_resource_base(parsed: &Html,/' src/formats/mhtml.rs
          sed -i '/fn html_resource_base(parsed: &Html,/{n;/let parsed = Html::parse_document(html);/d;}' src/formats/mhtml.rs
          sed -i 's/    html: &str,/    parsed: &Html,/' src/formats/mhtml.rs
          sed -i '/fn collect_stylesheets_in_order(/,/let mut stylesheets = Vec::new();{/ { /let parsed = Html::parse_document(html);/d; }' src/formats/mhtml.rs
          cargo fmt --all
          git diff --check
      - name: Targeted HTML and MHTML regressions
        run: |
          cargo test --test html pdf_header_before_html_marker_remains_pdf
          cargo test --test html html_prefix_wins_over_embedded_pdf_marker
          cargo test --test mhtml ordinary_related_html_email_is_not_mhtml
          cargo test --test mhtml
          cargo test --test html
      - name: Commit exact candidate before full gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/formats/mhtml.rs
          git commit -m 'refactor: reuse parsed MHTML root document'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Rust full gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --locked
      - name: Node full gate
        working-directory: node
        run: |
          npm ci
          npm run build
          npm test
          cd ..
          git diff --exit-code -- node/index.js node/index.d.ts
      - name: WASM full gate
        run: |
          cargo clippy -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
          wasm-pack build wasm --release --target web --scope firecrawl
          node --test wasm/test.mjs
      - name: Python full gate
        run: |
          pip install maturin
          maturin build --release --locked --manifest-path python/Cargo.toml --out dist
          pip install --no-index --find-links dist firecrawl-anydoc
          python -m unittest discover -s python/tests
      - name: Confirm candidate remained unchanged
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Publish validated candidate branch
        run: git push origin HEAD:refs/heads/verify/mhtml-review3-candidate --force

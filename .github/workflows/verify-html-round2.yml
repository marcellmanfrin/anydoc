name: Verify HTML round 2

on:
  push:
    branches: [verify/html-round2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test html

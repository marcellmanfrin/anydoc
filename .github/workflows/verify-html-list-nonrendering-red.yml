name: Verify HTML list non-rendering RED
on:
  push:
    branches: [verify/html-list-nonrendering-red]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test html_list

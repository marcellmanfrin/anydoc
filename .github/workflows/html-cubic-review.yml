name: HTML review regressions

on:
  push:
    branches: [verify/html-cubic-review]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Refresh lockfile once
        shell: bash
        run: |
          cargo check --workspace --all-targets --all-features
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "Marcell Manfrin Barbacena"
            git config user.email "barbacena@gmail.com"
            git add Cargo.lock
            git commit -m "build: record direct html5ever dependency"
            git push
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --test html

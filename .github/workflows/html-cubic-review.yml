name: HTML review regressions

on:
  push:
    branches: [verify/html-cubic-review]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Assemble production HTML branch
        shell: bash
        run: |
          git fetch origin feature/html-support-pr
          git checkout -B promote-html origin/feature/html-support-pr
          git checkout origin/verify/html-cubic-review -- \
            Cargo.toml Cargo.lock src/formats/detect.rs src/formats/html.rs tests/html.rs
          git diff --cached --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Commit and push HTML fixes
        shell: bash
        run: |
          git config user.name "Marcell Manfrin Barbacena"
          git config user.email "barbacena@gmail.com"
          git commit -m "fix: address HTML review regressions"
          git push origin HEAD:feature/html-support-pr

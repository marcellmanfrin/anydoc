name: HTML review regressions

on:
  push:
    branches: [verify/html-cubic-review]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt once
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet -- src/formats/detect.rs src/formats/html.rs tests/html.rs; then
            git config user.name "Marcell Manfrin Barbacena"
            git config user.email "barbacena@gmail.com"
            git add src/formats/detect.rs src/formats/html.rs tests/html.rs
            git commit -m "style: format HTML review fixes"
            git push
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --test html

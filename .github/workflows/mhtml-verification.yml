name: MHTML verification
on:
  push:
    branches: [feature/mhtml-support]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply MHTML charset fix after RED regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('src/formats/html.rs')
          html = html_path.read_text()
          old = 'fn decode_html(bytes: &[u8]) -> String {'
          new = 'pub(crate) fn decode_html(bytes: &[u8]) -> String {'
          if old in html:
              if html.count(old) != 1:
                  raise SystemExit('unexpected decode_html match count')
              html_path.write_text(html.replace(old, new, 1))
          elif new not in html:
              raise SystemExit('decode_html signature not found')

          mhtml_path = Path('src/formats/mhtml.rs')
          mhtml = mhtml_path.read_text()
          marker = 'fn transfer_decoded_part_bytes('
          if marker not in mhtml:
              old_import = 'use mail_parser::{MessageParser, MimeHeaders};'
              new_import = '''use mail_parser::decoders::{
              base64::base64_decode, quoted_printable::quoted_printable_decode,
          };
          use mail_parser::{Encoding, Message, MessageParser, MessagePart, MimeHeaders};'''
              if mhtml.count(old_import) != 1:
                  raise SystemExit('unexpected mail_parser import match count')
              mhtml = mhtml.replace(old_import, new_import, 1)

              old_parse = '''    let html = html_part
                  .text_contents()
                  .ok_or_else(|| ConvertError::malformed("MHTML HTML root is not decodable text"))?;
              if html.len() as u64 > limits::MAX_ENTRY_BYTES {
                  return Err(ConvertError::ResourceLimit {
                      limit: "max_entry_bytes",
                      detail: format!(
                          "MHTML HTML root is {} bytes; maximum is {}",
                          html.len(),
                          limits::MAX_ENTRY_BYTES
                      ),
                  });
              }

              let resource_index = build_resource_index(&message.parts);
              let extra_css = collect_linked_css(html, &message.parts, &resource_index)?;
              let (assets, image_assets) = collect_image_assets(&message.parts)?;
              let ctx = MhtmlCtx { image_assets };

              super::html::parse_text_with_context(html, &extra_css, &ctx, assets)
          }'''
              new_parse = '''    let html_bytes = transfer_decoded_part_bytes(&message, html_part, "HTML root")?;
              if html_bytes.len() as u64 > limits::MAX_ENTRY_BYTES {
                  return Err(ConvertError::ResourceLimit {
                      limit: "max_entry_bytes",
                      detail: format!(
                          "MHTML HTML root is {} bytes; maximum is {}",
                          html_bytes.len(),
                          limits::MAX_ENTRY_BYTES
                      ),
                  });
              }
              let html = super::html::decode_html(&html_bytes);

              let resource_index = build_resource_index(&message.parts);
              let extra_css = collect_linked_css(&html, &message.parts, &resource_index)?;
              let (assets, image_assets) = collect_image_assets(&message.parts)?;
              let ctx = MhtmlCtx { image_assets };

              super::html::parse_text_with_context(&html, &extra_css, &ctx, assets)
          }'''
              if mhtml.count(old_parse) != 1:
                  raise SystemExit('unexpected MHTML parse block match count')
              mhtml = mhtml.replace(old_parse, new_parse, 1)

              insertion = '''fn transfer_decoded_part_bytes(
              message: &Message<'_>,
              part: &MessagePart<'_>,
              label: &str,
          ) -> Result<Vec<u8>, ConvertError> {
              let raw = message
                  .raw_message
                  .get(part.offset_body as usize..part.offset_end as usize)
                  .ok_or_else(|| {
                      ConvertError::malformed(format!("MHTML {label} byte range is invalid"))
                  })?;

              match part.encoding {
                  Encoding::None => Ok(raw.to_vec()),
                  Encoding::QuotedPrintable => quoted_printable_decode(raw).ok_or_else(|| {
                      ConvertError::malformed(format!(
                          "MHTML {label} quoted-printable body is invalid"
                      ))
                  }),
                  Encoding::Base64 => base64_decode(raw).ok_or_else(|| {
                      ConvertError::malformed(format!("MHTML {label} base64 body is invalid"))
                  }),
              }
          }

          '''
              anchor = 'fn build_resource_index(parts: &[mail_parser::MessagePart<\'_>]) -> HashMap<String, usize> {'
              if mhtml.count(anchor) != 1:
                  raise SystemExit('unexpected build_resource_index anchor count')
              mhtml = mhtml.replace(anchor, insertion + anchor, 1)
              mhtml_path.write_text(mhtml)
          PY

          cargo fmt --all
          cargo test --test mhtml_charset
          if ! git diff --quiet -- src/formats/html.rs src/formats/mhtml.rs; then
            git config user.name "Marcell Manfrin Barbacena"
            git config user.email "barbacena@gmail.com"
            git add src/formats/html.rs src/formats/mhtml.rs
            git commit -m "fix: honor HTML meta charset in MHTML parts"
            git push origin HEAD:feature/mhtml-support
          fi

      # Update the existing lockfile only as needed for the new direct dependency.
      # Do not regenerate the graph: that would upgrade unrelated semver-compatible
      # packages and invalidate existing snapshots.
      - name: Add MHTML dependency to existing lockfile
        run: cargo check -p anydoc
      - name: Show lockfile delta
        run: git diff -- Cargo.lock
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked

      - name: Node install
        working-directory: node
        run: npm ci
      - name: Node build
        working-directory: node
        run: npm run build
      - name: Node tests
        working-directory: node
        run: npm test
      - name: Generated Node bindings are current
        run: git diff --exit-code -- node/index.js node/index.d.ts

      - name: Install wasm-pack
        run: >
          curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          | tar xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
      - name: WASM clippy
        run: cargo clippy --locked -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: WASM build
        run: wasm-pack build wasm --release --target web --scope firecrawl --locked
      - name: WASM tests
        run: node --test wasm/test.mjs

      - name: Install maturin
        run: pip install maturin
      - name: Build Python wheel
        run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - name: Install Python wheel
        run: pip install --no-index --find-links dist firecrawl-anydoc
      - name: Python tests
        run: python -m unittest discover -s python/tests

      - name: Package verification artifacts
        run: |
          mkdir -p verification-artifacts
          cp Cargo.lock verification-artifacts/Cargo.lock
          cp dist/*.whl verification-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: mhtml-verification-artifacts
          path: verification-artifacts/
          if-no-files-found: error

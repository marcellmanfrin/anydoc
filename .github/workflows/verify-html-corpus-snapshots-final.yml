name: Verify final HTML corpus and snapshots
on:
  push:
    branches: [verify/html-corpus-snapshots-final]
jobs:
  html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test html
      - run: cargo test --locked --test html_corpus
      - run: cargo test --locked --test snapshots corpus -- --exact
      - run: cargo test --locked --test snapshots fixtures_detect_from_content -- --exact
      - name: Verify snapshots are deterministic
        run: git diff --exit-code -- tests/snapshots

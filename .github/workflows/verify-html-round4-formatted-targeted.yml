name: Verify formatted HTML round 4 targeted

on:
  push:
    branches:
      - verify/html-round4-formatted

jobs:
  html-targeted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --test html utf16
      - run: cargo test --locked --test html

name: Verify final MHTML review fixes

on:
  push:
    branches: [verify/mhtml-final]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked -p anydoc-wasm --target wasm32-unknown-unknown
      - name: Build and test Node binding
        run: |
          cd node
          npm ci
          npm run build
          npm test
      - name: Build Python wheel
        run: |
          python -m pip install --disable-pip-version-check maturin
          maturin build --release --manifest-path python/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: mhtml-review-wheel
          path: dist/*.whl
          if-no-files-found: error

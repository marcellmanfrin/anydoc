name: Verify HTML corpus export audit

on:
  push:
    branches: [verify/html-corpus-export-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - name: Export selected corpus documents to HTML
        run: |
          set -euxo pipefail
          mkdir -p out/docx-text out/docx-numbering out/odt-text out/xlsx-merged
          soffice --headless --convert-to html --outdir out/docx-text tests/fixtures/docx/text.docx
          soffice --headless --convert-to html --outdir out/docx-numbering tests/fixtures/docx/handmade-numbering.docx
          soffice --headless --convert-to html --outdir out/odt-text tests/fixtures/odt/text.odt
          soffice --headless --convert-to html --outdir out/xlsx-merged tests/fixtures/xlsx/handmade-merged.xlsx
          find out -type f -name '*.html' -printf '%p %s bytes\n' | sort
          find out -type f -name '*.html' -print0 | sort -z | xargs -0 sha256sum
          for html in out/*/*.html; do
            echo "=== $html ==="
            printf 'headings='; (grep -Eio '<h[1-6][ >]' "$html" || true) | wc -l
            printf 'tables='; (grep -Eio '<table[ >]' "$html" || true) | wc -l
            printf 'links='; (grep -Eio '<a[ >]' "$html" || true) | wc -l
            printf 'lists='; (grep -Eio '<(ul|ol)[ >]' "$html" || true) | wc -l
            printf 'colspan='; (grep -Eio 'colspan=' "$html" || true) | wc -l
            printf 'rowspan='; (grep -Eio 'rowspan=' "$html" || true) | wc -l
            echo "BASE64-BEGIN $html"
            base64 -w0 "$html"
            echo
            echo "BASE64-END $html"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: html-corpus-exports
          path: out/
          if-no-files-found: error
          retention-days: 1

name: Verify LibreOffice HTML corpus red phase

on:
  push:
    branches: [verify/html-corpus-realistic-red]

permissions:
  contents: read

jobs:
  html-corpus-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test html_corpus

name: HTML review fix verification
on:
  push:
    branches: [verify/html-review-fixes]
  workflow_dispatch:
jobs:
  verify-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo test --test html

name: HTML support verification
on:
  push:
    branches: [feature/html-support]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Apply implementation
        run: |
          if ! grep -q 'Format::Html' src/formats/mod.rs; then
            python3 .github/html-support/apply_core.py
          fi
          if ! grep -q 'Format::html' node/src/lib.rs; then
            python3 .github/html-support/apply_bindings.py
          fi
      - run: cargo fmt --all
      - run: cargo test --test html
      - run: cargo test --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p anydoc-wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: npm test
        working-directory: node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install maturin
      - run: maturin build --release --locked --manifest-path python/Cargo.toml --out dist
      - run: pip install --no-index --find-links dist firecrawl-anydoc
      - run: python -m unittest discover -s python/tests
      - name: Commit verified implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src tests/html.rs node/src/lib.rs node/cli.js node/index.js node/index.d.ts node/html.test.mjs python/src/lib.rs python/anydoc/_anydoc.pyi python/tests/test_html.py wasm/src/lib.rs README.md
          git commit -m 'feat: expose standalone HTML across bindings'
          git push origin HEAD:feature/html-support

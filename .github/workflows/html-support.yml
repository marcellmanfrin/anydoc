name: HTML support verification
on:
  push:
    branches: [feature/html-support]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply core implementation
        run: |
          if ! grep -q 'Format::Html' src/formats/mod.rs; then
            python3 .github/html-support/apply_core.py
          fi
      - run: cargo fmt --all
      - run: cargo test --test html
      - run: cargo test --lib
      - name: Commit verified core
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src tests/html.rs
          git commit -m 'feat: add standalone HTML support core'
          git push origin HEAD:feature/html-support

name: Verify controlled HTML corpus fixtures

on:
  push:
    branches: [verify/html-corpus-controlled-green]

permissions:
  contents: read

jobs:
  html-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test html_corpus

name: build-html-cubic-frameset-relative

on:
  push:
    branches: [build/html-cubic-frameset-relative]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update expected HTML corpus snapshots only
        run: |
          git fetch origin candidate/html-cubic-frameset-relative
          git checkout -B candidate/html-cubic-frameset-relative origin/candidate/html-cubic-frameset-relative
          INSTA_UPDATE=always cargo test --locked --test snapshots corpus -- --exact
          git status --short
          test -z "$(git status --short | grep -v '^ M tests/snapshots/' || true)"
          test -n "$(git status --short)"
          git config user.name "Marcell Manfrin Barbacena"
          git config user.email "barbacena@gmail.com"
          git add tests/snapshots
          git commit -m "test: update HTML image snapshots"
          git push origin HEAD:candidate/html-cubic-frameset-relative

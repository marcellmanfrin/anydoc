name: Verify HTML corpus regressions green

on:
  push:
    branches: [verify/html-corpus-green-final]

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test html
      - run: cargo test --locked --test html_corpus
